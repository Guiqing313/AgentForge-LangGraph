[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["venv", ".venv", "data", "docs/kb", "docs/upgrade"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"